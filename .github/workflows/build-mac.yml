name: Build macOS DMG

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Compila app
        run: |
          pyinstaller --windowed --name "Photo Crop" \
            --add-data ".assets:.assets" \
            photo_crop.py

      - name: Calcola versione
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "dmg=Photo-Crop-${VERSION}.dmg" >> "$GITHUB_OUTPUT"

      - name: Crea DMG
        run: |
          mkdir -p dmg_temp
          cp -R "dist/Photo Crop.app" dmg_temp/
          ln -s /Applications dmg_temp/Applications
          hdiutil create -volname "Photo Crop" \
            -srcfolder dmg_temp -ov -format UDZO \
            "${{ steps.ver.outputs.dmg }}"

      - name: Salva DMG come file scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ steps.ver.outputs.dmg }}

      - name: Allega DMG alla release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ver.outputs.dmg }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
